<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pasang Lambang Garuda Pancasila</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#1b1446;--bg2:#3a1450;--gold:#ffc83d;--red:#d7263d;--ink:#fff8e7;--card:#2a1d63;--ok:#2fbf71;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;font-family:'Baloo 2','Trebuchet MS',sans-serif;color:var(--ink);
background:radial-gradient(circle at 50% 0,#5a2a7a 0,var(--bg2) 35%,var(--bg1) 100%);background-color:var(--bg1);
display:flex;flex-direction:column;align-items:center;padding:14px 12px 28px;touch-action:manipulation}
h1{margin:4px 0 0;font-size:clamp(1.4rem,5vw,2.2rem);font-weight:800;color:var(--gold);text-align:center;text-shadow:0 3px 0 #7a2a00}
.sub{margin:0 0 6px;text-align:center;opacity:.9;font-size:1rem}
.bar{display:flex;gap:10px;align-items:center;margin:6px 0}
.dots{display:flex;gap:6px}.dots i{width:18px;height:18px;border-radius:50%;background:#ffffff22;border:2px solid var(--gold)}
.dots i.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:8px 20px;background:var(--red);color:#fff;cursor:pointer;box-shadow:0 4px 0 #8c1325}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #8c1325}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.stage{position:relative;width:min(100%,520px);aspect-ratio:580/546;margin-top:4px}
.stage img.g{position:absolute;inset:0;width:100%;height:100%;border-radius:18px;background:#fff;box-shadow:0 0 30px #ffc83d66}
.zone{position:absolute;display:flex;align-items:center;justify-content:center;border:2.5px dashed #9a8cc9;background:#fff0;border-radius:6px;transition:.2s}
.zone b{position:absolute;top:-2px;left:3px;font-size:clamp(.7rem,2.6vw,.95rem);color:#3a1450;background:var(--gold);border-radius:50%;width:1.35em;height:1.35em;text-align:center;line-height:1.35em}
.zone.hot{border-color:var(--red);background:#ffe9ec;transform:scale(1.06)}
.zone.done{background:#fff;border:2.5px solid var(--gold);animation:pop .5s}
.zone.c{border-radius:4px 4px 50% 50%}
.zone svg{width:90%;height:90%}.zone.hot{background:#ffe9ecdd}
@keyframes pop{50%{transform:scale(1.18)}}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px;padding:12px;border-radius:20px;background:#ffffff14;border:2px dotted #ffffff66;width:min(100%,520px);min-height:96px}
.slot{width:74px;height:74px}
.item{width:74px;height:74px;background:#fff;border-radius:14px;padding:6px;cursor:grab;touch-action:none;user-select:none;box-shadow:0 4px 0 #0005;border:2px dotted #6a5aa8}
.item svg{width:100%;height:100%;pointer-events:none}
.item.drag{position:fixed;z-index:50;cursor:grabbing;transform:scale(1.15) rotate(-4deg);box-shadow:0 14px 24px #0008}
.item.shake{animation:sh .45s}
@keyframes sh{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
.modal.show{display:flex}
.card{background:var(--card);border:4px solid var(--gold);border-radius:26px;max-width:440px;width:100%;padding:22px 20px;text-align:center;animation:in .35s cubic-bezier(.3,1.6,.5,1)}
.card.bad{border-color:var(--red)}
@keyframes in{from{transform:scale(.6);opacity:0}}
.card .ic{width:84px;height:84px;margin:0 auto 6px;background:#fff;border-radius:18px;padding:8px}
.card h2{margin:4px 0;font-size:1.45rem;color:var(--gold)}.card.bad h2{color:#ff8a98}
.card .nm{font-weight:700;margin:0 0 8px}
.card p{margin:0 0 14px;line-height:1.35;font-size:1.05rem}
.emoji{font-size:3.2rem;line-height:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h1>Pasang Lambang Garuda Pancasila</h1>
<p class="sub">Seret gambar ke perisai Garuda, sesuai nomor silanya!</p>
<div class="bar"><div class="dots" id="dots"></div><button id="reset">Main lagi</button></div>
<div class="stage" id="stage"></div>
<div class="tray" id="tray" aria-label="Gambar lambang sila"></div>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="card" id="card"></div></div>

// zona pada gambar 580x546 (sila 1 di tengah)
const W=580,H=546;
const ZONES={4:[216,193,80,80,'start','start'],3:[308,193,80,80,'start','end'],5:[216,288,78,66,'end','start'],2:[310,288,78,66,'end','end'],1:[268,253,68,85,'center','center']};
const stage=document.getElementById('stage'),tray=document.getElementById('tray'),dots=document.getElementById('dots'),modal=document.getElementById('modal'),card=document.getElementById('card');
let done=new Set();
function build(){
 done.clear();stage.innerHTML=GARUDA;tray.innerHTML='';dots.innerHTML='<i></i>'.repeat(5);
 for(const k in ZONES){const[x,y,w,h,ai,ji]=ZONES[k],z=document.createElement('div');
  z.className='zone'+(k==1?' c':'');z.dataset.s=k;
  z.style.cssText=`left:${x/W*100}%;top:${y/H*100}%;width:${w/W*100}%;height:${h/H*100}%;align-items:${ai};justify-content:${ji};${k==1?'z-index:2':''}`;
  z.innerHTML=`<b>${k}</b>`;stage.appendChild(z)}
 [1,2,3,4,5].sort(()=>Math.random()-.5).forEach(k=>{
  const s=document.createElement('div');s.className='slot';
  s.innerHTML=`<div class="item" data-s="${k}" tabindex="0" aria-label="Gambar ${SILA[k].l}">${ICON[k]}</div>`;tray.appendChild(s)});
 tray.querySelectorAll('.item').forEach(drag)}
function zoneAt(x,y){const zs=[...stage.querySelectorAll('.zone:not(.done)')].sort((a,b)=>(b.dataset.s==1)-(a.dataset.s==1));
 return zs.find(z=>{const r=z.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom})}
function drag(el){
 let ox,oy,hot=null;
 el.addEventListener('pointerdown',e=>{
  const r=el.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;
  el.classList.add('drag');el.style.left=r.left+'px';el.style.top=r.top+'px';el.setPointerCapture(e.pointerId);e.preventDefault()});
 el.addEventListener('pointermove',e=>{
  if(!el.classList.contains('drag'))return;
  el.style.left=e.clientX-ox+'px';el.style.top=e.clientY-oy+'px';
  const z=zoneAt(e.clientX,e.clientY);if(hot&&hot!==z)hot.classList.remove('hot');hot=z||null;if(z)z.classList.add('hot')});
 el.addEventListener('pointerup',e=>{
  if(!el.classList.contains('drag'))return;
  el.classList.remove('drag');el.style.left=el.style.top='';
  if(hot)hot.classList.remove('hot');
  const z=zoneAt(e.clientX,e.clientY);hot=null;if(!z)return;
  const k=+el.dataset.s;
  if(+z.dataset.s===k){
   z.classList.add('done');z.insertAdjacentHTML('beforeend',ICON[k]);
   if(k==1||k==2)z.style.background=k==1?'#222':'#d7263d';
   el.parentElement.remove();done.add(k);
   dots.children[done.size-1].classList.add('on');
   show(true,k)
  }else{el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),500);show(false)}
 });
}
function show(ok,k){
 if(ok){const s=SILA[k];
  card.className='card';
  card.innerHTML=`<div class="ic">${ICON[k]}</div><h2>Benar! Hebat! 🎉</h2><p class="nm">Sila ke-${k}: ${s.n}</p><p><b>${s.l}</b> — ${s.m}</p><button id="ok">${done.size==5?'Lihat hasilnya':'Lanjut'}</button>`;
 }else{
  card.className='card bad';
  card.innerHTML=`<div class="emoji">🤔</div><h2>Yah, salah!</h2><p>Coba lagi yuk, kalian bisa!</p><button id="ok">Coba lagi</button>`}
 modal.classList.add('show');const b=document.getElementById('ok');b.focus();
 b.onclick=()=>{modal.classList.remove('show');if(ok&&done.size==5)win()}
}
function win(){
 card.className='card';
 card.innerHTML=`<div class="emoji">🦅🌟</div><h2>Garuda Pancasila lengkap!</h2><p>Kamu hafal kelima sila dan maknanya. Bangga jadi anak Indonesia! Bhinneka Tunggal Ika.</p><button id="ok">Main lagi</button>`;
 modal.classList.add('show');document.getElementById('ok').onclick=()=>{modal.classList.remove('show');build()}}
document.getElementById('reset').onclick=build;
build();
</script>
